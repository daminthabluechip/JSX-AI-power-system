services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: transport
      POSTGRES_PASSWORD: transport
      POSTGRES_DB: transport
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transport"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    environment:
      ROUTING_PROVIDER: osrm
      OSRM_TIME_FACTOR: "1.3"
      DATABASE_URL: postgresql+psycopg2://transport:transport@db:5432/transport
      CORS_ORIGIN: http://localhost:3000
      API_KEY: ${API_KEY:-}
      DEMO_MODE: ${DEMO_MODE:-}
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: /api
    environment:
      BACKEND_URL: http://backend:5000
      API_KEY: ${API_KEY:-}
      BASIC_AUTH_USER: mentor
      BASIC_AUTH_PASSWORD: ${BASIC_AUTH_PASSWORD:-}
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
