databases:
  - name: transport-db
    plan: free
    databaseName: transport
    user: transport

services:
  - type: web
    name: jsx-transport-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: transport-db
          property: connectionString
      - key: API_KEY
        generateValue: true
      - key: DEMO_MODE
        value: "true"
      - key: ROUTING_PROVIDER
        value: haversine
      - key: OSRM_TIME_FACTOR
        value: "1.3"
      - key: SOLVER_TIME_LIMIT_S
        value: "10"

  - type: web
    name: jsx-transport-web
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    plan: free
    healthCheckPath: /favicon.ico
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: /api
      - key: BACKEND_URL
        sync: false
      - key: API_KEY
        fromService:
          type: web
          name: jsx-transport-api
          envVarKey: API_KEY
      - key: BASIC_AUTH_PASSWORD
        sync: false
      - key: BASIC_AUTH_USER
        value: mentor
